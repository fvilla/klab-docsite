[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "klab-docsite"
version = "0.1.0"
description = "Material for MkDocs documentation site for k.LAB"
requires-python = ">=3.9"
dependencies = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "tomli>=2,<3; python_version < '3.11'",
]

[tool.setuptools]
packages = []
