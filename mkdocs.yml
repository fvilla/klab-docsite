site_name: k.LAB Documentation
site_description: Architecture, service contracts, development guides, and component documentation for k.LAB
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: reference/klab-services/KLAB.md
  - Platform:
      - Architecture: reference/klab-services/ARCHITECTURE.md
      - k.LAB technical note: reference/klab-services/KLAB.md
      - Scopes: reference/klab-services/SCOPES.md
      - Semantic modeling: reference/klab-services/SEMANTIC_MODELING.md
      - ODO-IM: reference/klab-services/ODO_IM.md
      - Provenance: reference/klab-services/PROVENANCE.md
      - Components: reference/klab-services/COMPONENTS.md
      - Storage: reference/klab-services/STORAGE.md
  - Languages:
      - Observable expressions: reference/klab-services/OBSERVABLES.md
      - Worldview ontology: reference/klab-services/ONTOLOGY_LANGUAGE.md
      - k.IM: reference/klab-services/KIM.md
      - k.Actors: reference/klab-services/AGENTS.md
      - Agent compiler: reference/klab-services/AGENT_COMPILER.md
  - Services:
      - Resources service: reference/klab-services/RESOURCES.md
      - Observation resolution: reference/klab-services/RESOLUTION.md
      - Expressions: reference/klab-services/EXPRESSIONS.md
      - Resource workflows: reference/klab-services/WORKFLOWS.md
      - Web UI architecture: reference/klab-services/WEBUI_ARCHITECTURE.md
      - Web UI extensions: reference/klab-services/WEBUI_EXTENSION.md
  - IDE:
      - User guide: reference/klab-ide/IDE.md
      - Architecture: reference/klab-ide/IDE_ARCHITECTURE.md
      - Project structure: reference/klab-ide/PROJECT.md
